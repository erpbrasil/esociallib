[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "esociallib"
version = "0.1.1"
description = "Biblioteca Python para geração, validação e transmissão de eventos eSocial S-1.3"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "KMEE", email = "dev@kmee.com.br" },
]
keywords = ["esocial", "sped", "brasil", "rh", "folha", "xsdata"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Accounting",
]
requires-python = ">=3.10"
dependencies = [
    # Geração e serialização XML
    "xsdata[lxml]>=24.0",
    "lxml",
    # Ecossistema erpbrasil — assinatura ICP-Brasil e transmissão SOAP mTLS
    "erpbrasil.assinatura>=1.8.0",
    "erpbrasil.transmissao>=1.1.0",
    # Utilitários brasileiros (CPF/CNPJ, etc)
    "erpbrasil.base>=2.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.1",
    "xsdata[cli]>=24.0",   # CLI para regenerar bindings
]

[project.urls]
Homepage = "https://github.com/erpbrasil/esociallib"
Repository = "https://github.com/erpbrasil/esociallib"

[tool.hatch.build.targets.wheel]
packages = ["esociallib"]

[tool.ruff]
line-length = 119
target-version = "py310"
exclude = ["esociallib/esocial/bindings"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=esociallib --cov-report=term-missing"
